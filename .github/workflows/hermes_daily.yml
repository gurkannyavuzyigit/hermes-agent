name: Hermes Autonomous Intelligence Agent

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-hermes-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Hermes Agent Script
        env:
          HERMES_API_URL: ${{ secrets.HERMES_API_URL }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          RECIPIENT_PHONE: ${{ secrets.RECIPIENT_PHONE }}
        run: |
          python hermes_agent.py
